<head>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">   
</head>   
<body>
<style>
    body {
        background-image: url("https://raw.githubusercontent.com/Helos-dev/WebOs/refs/heads/main/HelosOs/%E2%80%94Pngtree%E2%80%94futuristic%20hi%20tech%20background%203d_4791887.jpg");
        background-size: contain;
        background-color: #000;
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #Title {
        color: antiquewhite;
        transform: translateY(-30px);
        font-family: 'Righteous', sans-serif;
    }

    #subtitle {
        color: antiquewhite;
        transform: translateY(-30px);
        font-family: 'Righteous', sans-serif;
    }
    .button {
        background: #a30b0b;
        color: rgb(255, 255, 255);
        padding: 0.35em 1.2em;
        border: none;
        border-radius: 0.9em;
        font-size: 30px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: inset 0 0 1.6em -0.6em #714da6;
        width: 500px;
        font-family: 'Righteous', sans-serif;
        
    }
    .button:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(163, 112, 240, 0.4);
    }
    .button:active {
        animation: bounce 0.4s ease-in-out;
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        30%      { transform: translateY(8px)  scale(0.95); }
        60%      { transform: translateY(-6px) scale(1.03); }
        80%      { transform: translateY(3px)  scale(0.98); }
    }



</style>
<h1 id="Title">Helos Os</h1>
<h2 id="subtitle">The system for who likes things not to be complex but work</h2>
<a class="button" href = "home.html"> Click Here To Boot Into Helos OS </a>

</body>
